AutoName: Fedi3

RepoType: git
Repo: https://github.com/redhunt07/Fedi3.git

Builds:
  - versionName: 0.11.11
    versionCode: 6015
    commit: dbc76d6b1876f802510e7bab4ce229904c0f8973
    sudo:
      - apt-get update
      - apt-get install -y build-essential clang cmake pkg-config openjdk-21-jdk-headless rustup
    srclibs:
      - flutter@stable
    rm:
      - app/ios
      - app/linux
      - app/macos
      - app/web
      - app/windows
    prebuild:
      - sed -i '/android.builder.sdkDownload=false/d' app/android/gradle.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - git -C $$flutter$$ checkout -f 3.50.0
      - rustup default 1.99.1
      - rustup target add aarch64-linux-android
      - pushd app
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="$$flutter$$/bin:$HOME/.cargo/bin:$PATH"
      - export FEDI3_ANDROID_NDK=$$NDK$$
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - bash scripts/build_android_fdroid.sh arm64-v8a
    output: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    ndk: r28c

  - versionName: 0.11.11
    versionCode: 8015
    commit: dbc76d6b1876f802510e7bab4ce229904c0f8973
    sudo:
      - apt-get update
      - apt-get install -y build-essential clang cmake pkg-config openjdk-21-jdk-headless rustup
    srclibs:
