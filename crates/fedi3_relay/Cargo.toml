[package]
name = "fedi3_relay"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
http = "1"
fedi3_protocol = { path = "../fedi3_protocol", features = ["net", "crypto"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
httpdate = "1"
aes-gcm = { version = "0.10", features = ["std"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
subtle = "2"
async-trait = "0.1"
# Use the current HTTPS client, without the legacy rustls 0.21 / Hyper 0.14 stack.
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "clock"] }
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.12"
deadpool = "0.10"

[dev-dependencies]
tokio-tungstenite = "0.21"
fedi3_core = { path = "../fedi3_core" }
