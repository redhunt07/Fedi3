[package]
name = "fedi3_push_gateway"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Self-hosted Web Push gateway for Fedi3 mobile wakeups (UnifiedPush)."

[dependencies]
aes-gcm = { version = "0.10", features = ["std"] }
anyhow = "1"
axum = "0.7"
base64 = "0.22"
fedi3_protocol = { path = "../fedi3_protocol", features = ["net"] }
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
