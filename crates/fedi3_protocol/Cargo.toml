[package]
name = "fedi3_protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }


[features]
crypto = ["dep:aws-lc-rs", "dep:pem-rfc7468", "dep:anyhow"]
net = ["dep:reqwest", "dep:tokio"]

[dependencies.reqwest]
version = "0.12"
default-features = false
optional = true

[dependencies.tokio]
version = "1"
features = ["net"]
optional = true

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt", "io-util", "time"] }

[dependencies.aws-lc-rs]
version = "1.19"
optional = true

[dependencies.pem-rfc7468]
version = "0.7"
features = ["alloc"]
optional = true

[dependencies.anyhow]
version = "1"
optional = true
