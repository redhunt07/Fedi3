        '202':
          description: Accettato
  /_fedi3/webrtc/poll:
    get:
      tags: [relay]
      summary: Ricevi segnali WebRTC
      security: [{httpSignature: []}]
      parameters:
        - name: peer
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Segnali
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /admin/users:
    get:
      tags: [admin]
      summary: Elenco utenti (admin)
      security:
        - adminBearer: []
      responses:
        '200':
          description: Utenti
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RelayUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/users/{user}:
    delete:
      tags: [admin]
      summary: Elimina account, blob media e metadati associati
      description: |
        L'account viene prima disabilitato. I blob vengono eliminati prima dei
        metadati; se lo storage fallisce, account e riferimenti restano per
        consentire di ripetere DELETE. Gli upload concorrenti non possono
        ricreare metadati dopo la cancellazione.
      security: [{adminBearer: []}]
      parameters:
        - name: user
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Eliminazione completata}
        '404': {description: Account non presente}
        '409': {description: Ripristinare il backend originale dei media prima di ritentare}
        '502': {description: Pulizia incompleta; account disabilitato e metadati conservati per retry}
  /admin/users/{user}/disable:
    post:
      tags: [admin]
      summary: Disabilita un utente
      security:
        - adminBearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Disabilitato
  /admin/users/{user}/enable:
    post:
      tags: [admin]
      summary: Abilita un utente
      security:
        - adminBearer: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Abilitato
  /_fedi3/relay/directory:
    get:
      tags: [relay]
      summary: Copia pubblica della directory inclusa nel relay
      security: []
      responses:
        '200':
          description: Directory fedi3-relay-directory/v1
  /transparency:
    get:
      tags: [relay]
      summary: Pagina pubblica della politica del relay
      security: []
      responses:
        '200':
          description: HTML senza dati personali
  /_fedi3/relay/transparency:
    get:
      tags: [relay]
      summary: Politica e testa del registro dei forward firmate Ed25519
      security: []
      responses:
        '200':
          description: payload_b64, public_key_b64, signature_b64 e algorithm
        '503':
          description: Firma non disponibile
  /_fedi3/relay/push/{username}:
    parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
    get:
      tags: [relay]
      summary: Dimensione della coda per la sincronizzazione dopo un push
      security:
        - relayToken: []
      responses:
        '200':
          description: pending_items, senza token o contenuti
        '401':
          description: Account non autorizzato
        '503':
          description: Database non disponibile
    put:
      tags: [relay]
      summary: Predisposizione push tramite gateway configurato, una installazione per account
      security:
        - relayToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              additionalProperties: false
              properties:
                provider:
                  type: string
                  enum: [unifiedpush, apns]
                token:
                  type: string
                  maxLength: 2048
                webpush_keys:
                  type: object
                  required: [pub_key, auth]
                  additionalProperties: false
                  properties:
                    pub_key:
                      type: string
                      minLength: 87
                      maxLength: 87
                    auth:
                      type: string
                      minLength: 22
                      maxLength: 22
      responses:
        '200':
          description: Registrazione sostituita, expires_at_ms a 30 giorni
        '400':
          description: Registrazione non valida
        '401':
          description: Token non valido o account disabilitato
        '503':
          description: Gateway non configurato o database non disponibile
    delete:
      tags: [relay]
      summary: Revoca registrazione push
      security:
        - relayToken: []
      responses:
        '204':
          description: Registrazione rimossa
        '401':
          description: Token non valido o account disabilitato
        '503':
          description: Database non disponibile
  /_fedi3/relay/turn/{username}:
    parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
    get:
      tags: [relay]
      summary: Pool ICE privato di operatori TURN configurati
      security:
        - relayToken: []
      responses:
        '200':
          description: Lista di server con urls, username e credential distinti; no-store
        '204':
          description: Pool non configurato
        '401':
          description: Token non valido o account disabilitato
        '503':
          description: File del pool non valido o non disponibile
  /_fedi3/relay/push-config:
    get:
      tags: [relay]
      summary: Disponibilità provider e chiave VAPID pubblica
      security: []
      responses:
        '200':
          description: enabled, providers e vapid_public_key; nessun segreto gateway
  /_fedi3/relay/forward-log:
    get:
      tags: [relay]
      summary: Pagina di commitment pubblici con checkpoint Ed25519
      security: []
      parameters:
        - in: query
          name: after
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: head, checkpoint firmato e items con sequence, previous_hash, commitment e hash
        '503':
          description: Registro o firma non disponibili
  /_fedi3/relay/receipts/{username}:
    parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
    get:
      tags: [relay]
      summary: Ricevute private dei forward per il proprio account
      security:
        - relayToken: []
      parameters:
        - in: query
          name: after
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 10
      responses:
        '200':
          description: items con buste firmate, no-store; scope core_acknowledged o core_rejected solo dopo firma core verificata
        '401':
          description: Account non autorizzato
        '503':
          description: Registro non disponibile
components:
  securitySchemes:
    telemetryToken:
      type: apiKey
      in: header
      name: X-Fedi3-Telemetry-Token
      description: Richiesto soltanto se configurato dal relay; firma e prova origine restano obbligatorie.
    httpSignature:
      type: apiKey
      in: header
      name: Signature
      description: Firma HTTP associata all'attore verificato; comprende target, host, date e digest quando previsto.
    internalToken:
      type: apiKey
      in: header
      name: X-Fedi3-Internal
      description: Token interno UI ↔ core.
    relayToken:
      type: http
      scheme: bearer
      description: Token dell'identità verso il relay.
    adminBearer:
      type: http
      scheme: bearer
      description: Token admin del relay.
  parameters:
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_]{1,64}$'
    Actor:
      name: actor
      in: path
      required: true
      schema:
        type: string
        format: uri
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Query:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token mancante o non valido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Timeline:
      description: Timeline di note
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TimelineResponse'
    Search:
      description: Risultati di ricerca
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchResponse'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        version:
          type: string
        db:
          type: string
    WebFinger:
      type: object
      required: [subject, links]
      properties:
        subject:
          type: string
        aliases:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            type: object
            additionalProperties: true
    Actor:
      type: object
      required: [id, type, preferredUsername, inbox, outbox]
      properties:
        id:
          type: string
          format: uri
        type:
          type: string
          example: Person
        preferredUsername:
          type: string
        name:
          type: string
        summary:
          type: string
        url:
          type: string
          format: uri
        inbox:
          type: string
          format: uri
        outbox:
          type: string
          format: uri
        followers:
          type: string
          format: uri
        following:
          type: string
          format: uri
        icon:
          $ref: '#/components/schemas/Media'
        image:
          $ref: '#/components/schemas/Media'
    Media:
      type: object
      properties:
        type:
          type: string
          example: Image
        mediaType:
          type: string
        url:
          type: string
          format: uri
        name:
          type: string
    Note:
      type: object
      required: [type, id, attributedTo, content, published]
      properties:
        type:
          type: string
          example: Note
        id:
          type: string
          format: uri
        attributedTo:
          type: string
          format: uri
        content:
          type: string
        published:
          type: string
          format: date-time
        inReplyTo:
          type: string
          format: uri
          nullable: true
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        attachment:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        tag:
          type: array
          items:
            type: object
            additionalProperties: true
    OutboxCollection:
      type: object
      required: [type, orderedItems]
      properties:
        type:
          type: string
          example: OrderedCollectionPage
        totalItems:
          type: integer
        orderedItems:
          type: array
          items:
            type: object
            additionalProperties: true
        next:
          type: string
          format: uri
          nullable: true
    Collection:
      type: object
      required: [type]
