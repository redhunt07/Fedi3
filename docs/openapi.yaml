  /tunnel/{user}:
    get:
      tags: [relay]
      summary: Tunnel WebSocket per il core
      description: |
        Authorization: Bearer è il metodo preferito. Il token nella query è
        compatibilità per vecchi client, da non inserire in log o link condivisi.
      security:
        - relayToken: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          deprecated: true
          schema:
            type: string
      responses:
        '101':
          description: Upgrade WebSocket
  /_fedi3/relay/users:
    get:
      tags: [relay]
