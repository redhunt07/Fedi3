openapi: 3.1.0
info:
  title: Fedi3 Core and Relay API
  version: 1.0.0
  description: |
    API HTTP del core Fedi3 (identità e dati locali) e del relay pubblico.
    Il core espone sia endpoint ActivityPub (webfinger, actor, outbox, inbox)
    sia endpoint interni per il client (`/_fedi3/*`), protetti dal token interno.
    Il relay espone registrazione, tunnel WebSocket, discovery, ricerca e admin.
  license:
    name: AGPL-3.0-only
servers:
  - url: http://127.0.0.1:8788
    description: Core locale (identità)
  - url: https://relay.example.org
    description: Relay pubblico
security:
  - internalToken: []
tags:
  - name: core
  - name: activitypub
  - name: relay
  - name: admin
paths:
  /healthz:
    get:
      tags: [core, relay]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Servizio attivo
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /readyz:
    get:
      tags: [core, relay]
      summary: Readiness probe (DB raggiungibile)
      security: []
      responses:
        '200':
          description: Pronto
        '503':
          description: Database non pronto
  /.well-known/webfinger:
    get:
      tags: [activitypub]
      summary: WebFinger (acct:user@domain)
      security: []
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
            example: acct:alice@fedi3.test
      responses:
        '200':
          description: Documento WebFinger
          content:
            application/jrd+json:
              schema:
                $ref: '#/components/schemas/WebFinger'
        '404':
          $ref: '#/components/responses/NotFound'
  /.well-known/nodeinfo:
    get:
      tags: [activitypub]
      summary: Link NodeInfo
      security: []
      responses:
        '200':
          description: Link a NodeInfo 2.0
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /nodeinfo/2.0:
    get:
      tags: [activitypub]
      summary: Documento NodeInfo 2.0
      security: []
      responses:
        '200':
          description: NodeInfo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /.well-known/host-meta:
    get:
      tags: [activitypub]
      summary: Host-meta XML
      security: []
      responses:
        '200':
          description: XML host-meta
          content:
            application/xrd+xml:
              schema:
                type: string
  /.well-known/host-meta.json:
    get:
      tags: [activitypub]
      summary: Host-meta JSON
      security: []
      responses:
        '200':
          description: JSON host-meta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /users/{username}:
    get:
      tags: [activitypub]
      summary: Documento actor ActivityPub
      security: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Actor
          content:
            application/activity+json:
              schema:
                $ref: '#/components/schemas/Actor'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{username}/outbox:
    get:
      tags: [activitypub]
      summary: Outbox ActivityPub paginata
      security: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - name: page
          in: query
          schema:
            type: boolean
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Collezione outbox
          content:
            application/activity+json:
              schema:
                $ref: '#/components/schemas/OutboxCollection'
    post:
      tags: [core]
      summary: Pubblica una nota nell'outbox
      parameters:
        - $ref: '#/components/parameters/Username'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Nota creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{username}/followers:
    get:
      tags: [activitypub]
      summary: Collezione follower
      security: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Collezione follower
          content:
            application/activity+json:
              schema:
                $ref: '#/components/schemas/Collection'
  /users/{username}/following:
    get:
      tags: [activitypub]
      summary: Collezione following
      security: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Collezione following
          content:
            application/activity+json:
              schema:
                $ref: '#/components/schemas/Collection'
  /users/{username}/inbox:
    post:
      tags: [activitypub]
      summary: Inbox personale (HTTP Signature richiesta)
      security: []
      parameters:
        - $ref: '#/components/parameters/Username'
      requestBody:
        required: true
        content:
          application/activity+json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Attività accettata
        '401':
          $ref: '#/components/responses/Unauthorized'
  /inbox:
    post:
      tags: [activitypub]
      summary: Shared inbox (HTTP Signature richiesta)
      security: []
      requestBody:
        required: true
        content:
          application/activity+json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Attività accettata
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{username}/media:
    post:
      tags: [core, relay]
      summary: Carica byte media (non multipart)
      description: |
        Core: token interno. Relay: Bearer dell'utente; quota prenotata
        atomicamente prima dello storage. Content-Type deve corrispondere
        al contenuto; SVG non è accettato. X-Filename fornisce l'estensione.
      security:
        - internalToken: []
        - relayToken: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - name: X-Filename
          in: header
          schema: {type: string, default: upload.bin}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Media caricato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Limite del corpo o quota utente superati
        '415':
          description: MIME non supportato o firma del file non corrispondente
        '502':
          description: Storage non disponibile; prenotazione conservata se la pulizia non riesce
  /users/{username}/media/{mediaId}:
    get:
      tags: [core, relay]
      summary: Scarica un media
      security: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - name: mediaId
          in: path
          required: true
          schema: {type: string}
        - name: Range
          in: header
          description: "Relay: un singolo intervallo bytes, anche suffisso"
          schema: {type: string}
        - name: If-None-Match
          in: header
          schema: {type: string}
        - name: If-Range
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Contenuto binario; relay trasmette in streaming
        '206':
          description: Intervallo parziale (relay)
        '304':
          description: ETag invariato (relay)
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Intervallo non soddisfacibile (relay)
    delete:
      tags: [relay]
      summary: Elimina blob e metadati del media dal relay
      servers:
        - url: https://relay.example.org
      security:
        - relayToken: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - name: mediaId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Eliminato
        '401':
          $ref: '#/components/responses/Unauthorized'
  /_fedi3/timeline/home:
    get:
      tags: [core]
      summary: Timeline home locale
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/Timeline'
  /_fedi3/timeline/unified:
    get:
      tags: [core]
      summary: Timeline unificata (locale + federata)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/Timeline'
  /_fedi3/timeline/federated:
    get:
      tags: [core]
      summary: Timeline federata
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/Timeline'
  /_fedi3/timeline/dht:
    get:
      tags: [core]
      summary: Timeline globale P2P
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/Timeline'
  /_fedi3/note/replies:
    get:
      tags: [core]
      summary: Risposte a una nota
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Timeline'
  /_fedi3/search/notes:
    get:
      tags: [core]
      summary: Ricerca note
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/Search'
  /_fedi3/search/users:
    get:
      tags: [core]
      summary: Ricerca utenti
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/Search'
  /_fedi3/search/hashtags:
    get:
      tags: [core]
      summary: Ricerca hashtag
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Search'
  /_fedi3/suggested/actors:
    get:
      tags: [core]
      summary: Account suggeriti
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: URL attore suggeriti
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {type: string}
  /_fedi3/trending/hashtags:
    get:
      tags: [core]
      summary: Hashtag in tendenza
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Hashtag più usati
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, count]
                      properties:
                        name: {type: string}
                        count: {type: integer}
  /_fedi3/notifications:
    get:
      tags: [core]
      summary: Notifiche locali
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, mentions, reactions, follows, boosts, likes]
      responses:
        '200':
          description: Notifiche
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  next:
                    type: string
                    nullable: true
  /_fedi3/chat/threads:
    get:
      tags: [core]
      summary: Elenco thread di chat
      responses:
        '200':
          description: Thread
          content:
            application/json:
              schema:
                type: object
                required: [threads]
                properties:
                  threads:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatThread'
  /_fedi3/chat/threads/{threadId}:
    get:
      tags: [core]
      summary: Messaggi di un thread
      parameters:
        - $ref: '#/components/parameters/ThreadId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messaggi
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
  /_fedi3/chat/send:
    post:
      tags: [core]
      summary: Invia un messaggio cifrato E2E
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSendRequest'
      responses:
        '201':
          description: Messaggio inviato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
  /_fedi3/chat/react:
    post:
      tags: [core]
      summary: Reazione a un messaggio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thread_id, message_id, reaction]
              properties:
                thread_id:
                  type: string
                message_id:
                  type: string
                reaction:
                  type: string
      responses:
        '200':
          description: Reazione registrata
  /_fedi3/chat/seen:
    post:
      tags: [core]
      summary: Segna un thread come letto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thread_id]
              properties:
                thread_id:
                  type: string
      responses:
        '200':
          description: Stato aggiornato
  /_fedi3/chat/thread/create:
    post:
      tags: [chat]
      summary: Crea una chat senza inviare messaggi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients]
              properties:
                recipients:
                  type: array
                  items: {type: string}
                title: {type: string}
                kind: {type: string, enum: [dm, group]}
      responses:
        '200':
          description: Thread creato
          content:
            application/json:
              schema:
                type: object
                required: [thread_id, kind]
                properties:
                  thread_id: {type: string}
                  kind: {type: string}
                  title: {type: string, nullable: true}
  /_fedi3/chat/thread/members:
    get:
      tags: [core]
      summary: Membri di un thread
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      responses:
        '200':
          description: Membri
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [core]
      summary: Aggiorna i membri di un thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Membri aggiornati
  /_fedi3/chat/call/signal:
    post:
      tags: [chat]
      summary: Invia un segnale di chiamata cifrato ai membri del thread
      description: Il relay trasporta solo la segnalazione; audio e video viaggiano P2P in WebRTC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thread_id, call_id, action]
              properties:
                thread_id: {type: string}
                call_id: {type: string}
                action: {type: string}
                to: {type: string, nullable: true}
                data: {type: object, additionalProperties: true, nullable: true}
      responses:
        '200':
          description: Segnale inviato
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  sent: {type: integer}
  /_fedi3/chat/call/signals:
    get:
      tags: [chat]
      summary: Segnali di chiamata del thread oppure globali
      description: |
        Omettendo thread_id, restituisce segnali globali dei thread di cui
        l'utente locale è membro, filtrati per destinatario e ordinati per ID.
        Usare after_id come cursore: due eventi nello stesso millisecondo
        non vengono persi. Con thread_id resta disponibile il polling per data.
      parameters:
        - name: thread_id
          in: query
          required: false
          schema: {type: string}
        - name: after_id
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: after_ms
          in: query
          schema: {type: integer, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Segnali indirizzati all'utente locale
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {type: object, additionalProperties: true}
  /_fedi3/chat/search:
    get:
      tags: [chat]
      summary: Cerca in tutte le chat dell'utente locale
      description: Ricerca locale, limitata ai thread di cui l'utente è membro; nessuna chiamata di rete.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Risultati con thread e testo del messaggio
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /_fedi3/chat/thread/search:
    get:
      tags: [chat]
      summary: Cerca nei messaggi di un thread
      parameters:
        - $ref: '#/components/parameters/ThreadId'
        - name: q
          in: query
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Messaggi corrispondenti
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {type: object, additionalProperties: true}
  /_fedi3/chat/thread/pin:
    get:
      tags: [chat]
      summary: Messaggio fissato del thread
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      responses:
        '200':
          description: Pin corrente o null
          content:
            application/json:
              schema:
                type: object
                properties:
                  pin: {type: object, nullable: true, additionalProperties: true}
    post:
      tags: [chat]
      summary: Fissa o rimuove un messaggio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thread_id, message_id]
              properties:
                thread_id: {type: string}
                message_id: {type: string}
                pinned: {type: boolean, default: true}
      responses:
        '200':
          description: Pin aggiornato
  /_fedi3/chat/thread/join:
    post:
      tags: [chat]
      summary: Unisciti a un gruppo tramite link invito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thread_id]
              properties:
                thread_id: {type: string}
                title: {type: string}
      responses:
        '200':
          description: Iscrizione completata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /_fedi3/identity/export:
    get:
      tags: [core]
      summary: Esporta il pacchetto di identità dell'account
      description: |
        Restituisce la chiave privata RSA dell'attore e la coppia di chiavi di
        identità chat Kyber768. Il client sigilla il pacchetto prima di
        trasferirlo a un altro dispositivo.
      responses:
        '200':
          description: Pacchetto di identità
          content:
            application/json:
              schema:
                type: object
                required: [public_key_pem, private_key_pem, chat_identity_public_b64, chat_identity_secret_b64]
                properties:
                  public_key_pem: {type: string}
                  private_key_pem: {type: string}
                  chat_identity_public_b64: {type: string}
                  chat_identity_secret_b64: {type: string}
  /_fedi3/chat/snapshot:
    get:
      tags: [core]
      summary: Esporta lo stato delle chat per l'abbinamento QR
      description: |
        Thread, membri, messaggi, stati, reazioni, pin e segnali di chiamata.
        I messaggi sono limitati ai 10.000 più recenti o a circa 8 MB di JSON;
        truncated segnala quando i messaggi più vecchi sono stati esclusi.
      responses:
        '200':
          description: Snapshot delle chat
          content:
            application/json:
              schema:
                type: object
                required: [v, threads, members, messages, statuses, reactions, pins, call_signals, truncated]
                properties:
                  v: {type: integer}
                  threads: {type: array, items: {type: object, additionalProperties: true}}
                  members: {type: array, items: {type: object, additionalProperties: true}}
                  messages: {type: array, items: {type: object, additionalProperties: true}}
                  statuses: {type: array, items: {type: object, additionalProperties: true}}
                  reactions: {type: array, items: {type: object, additionalProperties: true}}
                  pins: {type: array, items: {type: object, additionalProperties: true}}
                  call_signals: {type: array, items: {type: object, additionalProperties: true}}
                  truncated: {type: boolean}
    post:
      tags: [core]
      summary: Importa uno snapshot delle chat
      description: Importazione idempotente; i duplicati vengono ignorati. Non invia ricevute né repliche.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Snapshot importato
        '400':
          description: JSON non valido o troppo grande
  /_fedi3/users/{username}/identity:
    get:
      tags: [relay]
      summary: Blob di identità sigillato dell'account
      description: Il relay memorizza solo l'envelope sigillato e non può decifrarlo.
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Envelope sigillato
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '404':
          description: Nessun blob pubblicato
    put:
      tags: [relay]
      summary: Pubblica il blob di identità sigillato
      parameters:
        - $ref: '#/components/parameters/Username'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '204':
          description: Blob memorizzato
        '400':
          description: Envelope non valido
  /_fedi3/pair/{code}:
    get:
      tags: [relay]
      summary: Recupera il pacchetto di abbinamento QR
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      responses:
        '200':
          description: Envelope sigillato con identità, configurazione e snapshot chat
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '404':
          description: Codice sconosciuto
        '410':
          description: Codice scaduto
    put:
      tags: [relay]
      summary: Pubblica il pacchetto di abbinamento QR
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - name: user
          in: query
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '204':
          description: Pacchetto memorizzato per dieci minuti
        '400':
          description: Codice o envelope non valido
  /_fedi3/chat/spool:
    get:
      tags: [relay]
      summary: Envelope chat accumulati per l'account
      description: |
        Restituisce gli envelope dopo il cursore indicato, dal più vecchio al
        più recente. Lo spool conserva solo testo cifrato per 90 giorni.
      parameters:
        - name: user
          in: query
          required: true
          schema: {type: string}
        - name: after
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Envelope e ultimo id
          content:
            application/json:
              schema:
                type: object
                required: [items, latest_id]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, envelope]
                      properties:
                        id: {type: integer}
                        envelope: {type: object, additionalProperties: true}
                  latest_id: {type: integer}
    /_fedi3/reactions:
    get:
      tags: [core]
      summary: Reazioni a una nota
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Reazioni
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /_fedi3/follow_requests:
    get:
      tags: [core]
      summary: Richieste di follow in attesa
      responses:
        '200':
          description: Richieste
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /_fedi3/follow_requests/{actor}/approve:
    post:
      tags: [core]
      summary: Approva una richiesta di follow
      parameters:
        - $ref: '#/components/parameters/Actor'
      responses:
        '200':
          description: Approvata
  /_fedi3/follow_requests/{actor}/reject:
    post:
      tags: [core]
      summary: Rifiuta una richiesta di follow
      parameters:
        - $ref: '#/components/parameters/Actor'
      responses:
        '200':
          description: Rifiutata
  /_fedi3/blocks:
    get:
      tags: [core]
      summary: Elenco domini/attori bloccati
      responses:
        '200':
          description: Blocchi
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [core]
      summary: Aggiorna blocchi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Blocchi aggiornati
  /_fedi3/social/follow:
