name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.job }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ matrix.job }}

      - name: cargo fmt --check
        if: matrix.job == 'fmt'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.job == 'clippy'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build
        if: matrix.job == 'test'
        run: cargo build --workspace --locked

      - name: cargo test
        if: matrix.job == 'test'
        run: cargo test --workspace --locked -- --test-threads=4

      - name: cargo audit (non-blocking)
        if: matrix.job == 'test'
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

  flutter:
    name: Flutter (${{ matrix.job }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: flutter analyze
        if: matrix.job == 'analyze'
        working-directory: app
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos

      - name: flutter test
        if: matrix.job == 'test'
        working-directory: app
        run: flutter test --reporter expanded

  platform-config:
    name: Platform configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android/iOS/macOS release configuration
        run: bash scripts/verify_platform_config.sh

  appimage:
    name: AppImage (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libmpv-dev libasound2-dev libpulse-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build AppImage
        run: |
          chmod +x scripts/build_core.sh scripts/build_appimage.sh
          scripts/build_appimage.sh release

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fedi3-AppImage
          path: dist/Fedi3-release-x86_64.AppImage
          if-no-files-found: error
