name: CI

on:
  push:
    branches: ["main", "master", "codex/release/*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  operations:
    name: Backup scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml
      - name: Check deployment scripts
        run: shellcheck -x -P scripts scripts/lib/dotenv.sh scripts/backup_relay_pg.sh scripts/restore_relay_pg.sh scripts/backup_relay_media.sh scripts/restore_relay_media.sh scripts/relay_diagnose.sh
      - name: Validate deployment and OpenAPI contracts
        run: python3 scripts/tests/test_deploy_config.py
      - name: Validate release and update contract
        run: python3 scripts/tests/test_release_contract.py
      - name: Validate shared relay directory
        run: python3 scripts/tests/test_relay_directory.py
      - name: Exercise backup and restore with the default dotenv template
        run: python3 scripts/tests/test_backup_scripts.py

  rust:
    name: Rust (${{ matrix.job }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ matrix.job }}

      - name: cargo fmt --check
        if: matrix.job == 'fmt'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.job == 'clippy'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build
        if: matrix.job == 'test'
        run: cargo build --workspace --locked

      - name: cargo test
        if: matrix.job == 'test'
        run: cargo test --workspace --locked -- --test-threads=4

      - name: Verify RSA and WebRTC compatibility with previous clients
        if: matrix.job == 'test'
        run: python3 scripts/verify_legacy_webrtc.py

      - name: cargo audit (required for releases)
        if: matrix.job == 'test'
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/codex/release/') }}
        run: |
          cargo install cargo-audit --locked
          cargo audit

  postgres:
    name: PostgreSQL atomic quota
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fedi3
          POSTGRES_DB: audit_quota
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fedi3 -d audit_quota"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-postgres
      - name: Verify concurrent PostgreSQL reservations and deletion
        env:
          FEDI3_TEST_POSTGRES_URL: postgres://fedi3:test-only-ci-password@127.0.0.1:5432/audit_quota
        run: cargo test -p fedi3_relay postgres_media_quota_reservation_is_atomic --locked -- --ignored

  flutter:
    name: Flutter (${{ matrix.job }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: flutter analyze
        if: matrix.job == 'analyze'
        working-directory: app
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos

      - name: flutter test
        if: matrix.job == 'test'
        working-directory: app
        run: flutter test --reporter expanded

  platform-config:
    name: Platform configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android/iOS/macOS release configuration
        run: bash scripts/verify_platform_config.sh

  appimage:
    name: AppImage (tags only)
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/codex/release/')
    runs-on: ubuntu-22.04
    needs: [rust, flutter, operations, platform-config, postgres]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libmpv-dev libasound2-dev libpulse-dev libsecret-1-dev libjsoncpp-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify release version
        run: |
          python3 -m pip install pyyaml
          FEDI3_RELEASE_TAG="${GITHUB_REF_NAME##*/}" python3 scripts/tests/test_release_contract.py

      - name: Build AppImage
        run: |
          chmod +x scripts/build_core.sh scripts/build_appimage.sh
          FEDI3_APPIMAGE_OUT="$PWD/dist/Fedi3-linux-x86_64.AppImage" scripts/build_appimage.sh release

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fedi3-AppImage
          path: dist/Fedi3-linux-x86_64.AppImage
          if-no-files-found: error

  windows-release:
    name: Windows client (tags only)
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/codex/release/')
    runs-on: windows-latest
    needs: [rust, flutter, operations, platform-config, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build native core and client package
        shell: pwsh
        run: |
          ./scripts/build_core.ps1 -Profile release
          ./scripts/release_build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Fedi3-Windows
          path: dist/Fedi3-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Prepare verified client release
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/codex/release/')
    needs: [appimage, windows-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fedi3-AppImage
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: Fedi3-Windows
          path: release-assets
      - name: Verify packages and publish the requested client release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME##*/}"
          if [[ "$GITHUB_REF" == refs/heads/codex/release/* ]]; then
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$main_sha" = "$GITHUB_SHA" || { echo "Release request is not current main"; exit 1; }
          fi
          cd release-assets
          test -s Fedi3-linux-x86_64.AppImage
          test -s Fedi3-windows-x64.zip
          sha256sum Fedi3-linux-x86_64.AppImage Fedi3-windows-x64.zip > checksums.txt
          sha256sum --check checksums.txt
          if gh release view "$release_tag" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$release_tag" --json isDraft --jq .isDraft)" = true || { echo "Release is already published"; exit 1; }
            test "$(gh release view "$release_tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA" || { echo "Draft release belongs to another commit"; exit 1; }
            gh release upload "$release_tag" Fedi3-linux-x86_64.AppImage Fedi3-windows-x64.zip checksums.txt --clobber
          else
            gh release create "$release_tag" --target "$GITHUB_SHA" --draft --generate-notes \
              --title "Fedi3 $release_tag" \
              Fedi3-linux-x86_64.AppImage Fedi3-windows-x64.zip checksums.txt
          fi
          if [[ "$GITHUB_REF" == refs/heads/codex/release/* ]]; then
            gh release edit "$release_tag" --draft=false --latest
          fi
