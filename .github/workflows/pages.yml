name: Pages

# Builds the public Fedi3 site (site/) and publishes it to GitHub Pages.
# The site is generated by site/build.mjs; the artifact is the static dist/
# folder, served under https://redhunt07.github.io/Fedi3/ unless a custom
# domain is configured in the repository settings.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Derive origin and base from the repository, so a fork or a rename
      # publishes correct canonical URLs without editing the build script.
      - name: Build site
        env:
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          SITE_BASE: /${{ github.event.repository.name }}
        run: node site/build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Upload IndexNow payload
        uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: site/dist/indexnow.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Download IndexNow payload
        uses: actions/download-artifact@v4
        with:
          name: indexnow
          path: indexnow

      # IndexNow notifies Bing, Yandex, Seznam and Naver in one request. The
      # key file is served from the site itself (site/dist/<key>.txt).
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data-binary @indexnow/indexnow.json)
            echo "IndexNow attempt $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then exit 0; fi
            sleep 20
          done
          exit 0
