name: Bug report / Segnalazione bug
description: Report a reproducible problem with this project.
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Explain the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest input, configuration or sequence that reproduces it.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Include commit or version, operating system, hardware and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, passwords, personal data and private prompts before posting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and the project documentation.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
